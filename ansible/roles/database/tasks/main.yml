---
- name: Run PostgreSQL Database container
  docker_container:
    name: postgres-db
    image: tristanbrouille/tp-devops-database:latest
    networks:
      - name: app-network
    env:
      POSTGRES_DB: db
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
    volumes:
      - db_data:/var/lib/postgresql/data
    restart_policy: always