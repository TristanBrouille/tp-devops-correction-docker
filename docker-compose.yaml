services:

  database:
    build: "database"
    environment:
      - POSTGRES_PASSWORD=pwd
    volumes:
      - db-volume:/var/lib/postgresql/data
    networks:
      - my-network

  simple-api:
    build: "simple-api"
    environment:
      - DATABASE_HOST=database
      - DATABASE_PASSWORD=pwd
    networks:
      - my-network

  front:
    build: ./Frontend
    networks:
      - app-network

  httpd:
    build: ./HttpServer
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - simpleapi
      - front

networks:
  app-network:

volumes:
  db-volume :